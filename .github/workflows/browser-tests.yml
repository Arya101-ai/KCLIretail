name: Kane CLI Integration Tests (Parallel with Assurance)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  kane-parallel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-spec:
          - "Verify homepage loads and key elements render correctly"
          - "Log in with standard_user, add item to cart, and verify cart badge"
          - "Proceed to checkout, enter user details, and confirm order receipt"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Execute Kane Test Spec
        id: kane_execution
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          kane-cli run "${{ matrix.test-spec }}" \
            --url "https://www.saucedemo.com" \
            --headless \
            --agent \
            --timeout 300 \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY"

      - name: Assurance - Validate Diagnostic Verdict
        if: always()
        run: |
          echo "=== KANE ASSURANCE DIAGNOSTIC VERDICT ==="
          if [ -d "$HOME/.testmuai/kaneai/sessions/" ]; then
            echo "Session logs and diagnostic verdicts successfully generated."
            ls -la $HOME/.testmuai/kaneai/sessions/
          else
            echo "Error: No assurance session records found!"
            exit 1
          fi

      - name: Upload Evidence & Assurance Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kane-evidence-assurance-${{ strategy.job-index }}
          path: ~/.testmuai/kaneai/sessions/