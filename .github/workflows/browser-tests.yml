name: Kane CLI Integration Tests (Parallel)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  kane-parallel-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-spec:
          - "Verify homepage loads and key elements render correctly"
          - "Log in with standard_user, add item to cart, and verify cart badge"
          - "Proceed to checkout, enter user details, and confirm order receipt"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install Kane CLI
        run: npm install -g @testmuai/kane-cli

      - name: Execute Kane Test Spec
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY }}
        run: |
          kane-cli run "${{ matrix.test-spec }}" \
            --url "https://www.saucedemo.com" \
            --headless \
            --agent \
            --timeout 300 \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY"

      - name: Upload Test Session Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kane-test-logs-${{ strategy.job-index }}
          path: ~/.testmuai/kaneai/sessions/